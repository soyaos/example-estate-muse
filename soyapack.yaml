spec_version: soyapack.v0
kind: Agent
name: estate-muse
version: 0.1.0-alpha.0
description: |
  EstateMuse — one sentence in, a 500-row editorial Excel out; every row
  spins up a WeChat 图文 or 短视频 in under a minute. DD-010 flagship
  reference for xlsx artifacts + per-row Actions.
authors:
  - name: SoyaOS Contributors
    email: hello@soyaos.ai
license: MIT
homepage: https://github.com/soyaos/example-estate-muse
runtime:
  compat: ">=0.1.0 <0.2.0"
determinism: stateful
affinity: any

expose:
  openai_compat: both
  virtual_model_id: soya:estate-muse

inputs:
  - name: seed
    type: string
    optional: false   # the one-sentence brief, e.g. "杭州亚运村二手房 500 条选题"
  - name: city_hint
    type: string
    optional: true

# 3-step prompt chain (APP-550 Phase B):
#
#   collect → preserve the full brief and produce 64 candidate themes (broad coverage,
#             every facet of the target market)
#   expand  → emit 800 candidate rows in enforced dimension partitions, preserving
#             the platform, audience and factual boundaries
#   dedupe  → select 500 candidate indices; the kernel assembles topics.v1
#             without rewriting any selected row
#
# Each later stage receives both the original request and the previous
# stage output; only the final
# stream is returned to the caller. The chat surface (POST
# /v1/chat/completions, model=soya:estate-muse) is what produces the
# initial xlsx. The CLI validates the actual row count with --expected-rows;
# per-row actions are currently operator-invoked (HTML companion orchestration
# is not yet wired, so prompts must not invent action URLs).
prompt:
  scaffold: minimal-input-high-quality
  tools: [tool.originality_check]
  indexed_table:
    target_rows: 500
    candidate_rows: 800
    batch_size: 100
    max_concurrency: 8
    batch_column: 1
    batch_values: [buy, hold, sell, market, policy, lifestyle, risk, compare]
    min_per_partition: 50
    columns: [标题, 维度, 切面, 钩子, 难度, 建议产物]
    column_rules:
      - column: 0
        suffix: "？"
        forbidden_substrings: [打火机, 点燃, 尾随, 确保增值, 稳赚, 保值保证, 实测分享]
      - column: 1
        allowed_values: [buy, hold, sell, market, policy, lifestyle, risk, compare]
      - column: 2
        allowed_values: [数据, 案例, 对比, 操作, 争议]
      - column: 3
        prefix: "拍摄前需核实："
        forbidden_substrings: [打火机, 点燃, 尾随, 确保增值, 稳赚, 保值保证, 大功率电器同时开启]
      - column: 4
        allowed_values: [low, med, high]
      - column: 5
        allowed_values: [图文, 短视频, 图文+短视频]
    sheet_name: Topics
    max_repairs: 1
    timeout_seconds: 300
  # Upstream remains operator-configured. The 2026-09-12 editorial regression
  # was verified with SOYA_MODEL_DEFAULT=qwen3.8-max-0902 and
  # SOYA_MODEL_ENABLE_THINKING=false. Other models require their own regression;
  # accepting response_format alone does not prove JSON-schema enforcement.
  steps:
    - { id: collect, prompt: prompts/collect.md }
    - { id: expand,  prompt: prompts/expand.md }
    - { id: dedupe,  prompt: prompts/dedupe.md }

artifacts:
  - kind: xlsx
    schema: topics.v1
  - kind: html
    schema: topics-table.v1
  - kind: markdown
    schema: wechat_post.v1
  - kind: markdown
    schema: video_script.v1

# Two per-row Action triggers. EstateMuse's editorial workflow is
# "scroll the Excel until a row looks promising, click 生成图文 to draft a
# WeChat article, or 生成短视频 to draft a 30-second script". Each action
# is its own prompt file under prompts/. (DD-010 / APP-502)
#
# RegisterFromPack loads each handler prompt at register time. POST
# /v1/agents/estate-muse/actions/{action_id} runs the prompt with a
# JSON envelope { row_id, payload } as the user message; the streamed
# body lands in ActionResult.Output["content"].
actions:
  - id: generate_post
    on: per_row
    handler: prompts/generate_post.md
    plan_handler: prompts/plan_post.md
    review_handler: prompts/review_action.md
    timeout: 60s
    text_validation:
      min_chars: 600
      max_chars: 900
      max_repairs: 1
      forbidden_phrases: [根据相关规定, 根据法律规定, 法律要求必须, 确保增值, 几万, 几十万, 智商税]
    artifacts: [wechat_post]
  - id: generate_video
    on: per_row
    handler: prompts/generate_video.md
    review_handler: prompts/review_action.md
    timeout: 60s
    text_validation:
      section: 口播全文
      mirror_table:
        section: 分镜
        column: 口播
        rows: 3
      min_chars: 60
      max_chars: 130
      max_repairs: 1
      forbidden_phrases: [根据相关规定, 根据法律规定, 法律要求必须, 确保增值, 几万, 几十万, 智商税]
    artifacts: [video_script]

# Stateful Agent: the 500-row workbook is kept under the agent's own
# state partition so the per-row action endpoints can look up a row's
# original context without trusting the caller's payload. (DD-010
# Stateful Agent surface — pkg/state)
state:
  scope: agent
  store: kv

sandbox:
  isolation: container
  image: html-base@0.1.0
  budget_seconds_max: 300        # 5 min for the initial 500-row run
  cold_start_target_ms: 3000
  capabilities:
    network_out:
      - host: api.openai.com
        port: 443
        proto: https
    fs_read:
      - /workdir
    fs_write:
      - /workdir/out
    determinism_tier: stateful
